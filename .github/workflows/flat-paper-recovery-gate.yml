name: FLAT PAPER recovery evidence tests
on:
  pull_request:
    paths:
      - 'tools/flat_paper_recovery_gate.py'
      - 'tools/flat_paper_recovery_transition.py'
      - 'tools/jasmy_flat_handoff_proof.py'
      - 'tests/test_flat_paper_recovery_gate.py'
      - 'tests/test_flat_paper_recovery_transition.py'
      - 'tests/test_jasmy_flat_handoff_proof.py'
      - '.github/workflows/flat-paper-recovery-gate.yml'
  workflow_dispatch:

jobs:
  flat-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime import dependencies
        run: >-
          python -m pip install requests==2.34.2 PySocks==1.7.1
          websocket-client==1.9.0 pandas==3.0.5 numpy==2.5.1
          matplotlib==3.11.1 mplfinance==0.12.10b0 six==1.17.0
      - name: Compile offline gate
        run: python -m py_compile tools/flat_paper_recovery_gate.py tools/flat_paper_recovery_transition.py tools/jasmy_flat_handoff_proof.py tests/test_jasmy_flat_handoff_proof.py tests/test_flat_paper_recovery_gate.py tests/test_flat_paper_recovery_transition.py
      - name: Run fail-closed synthetic tests
        run: python -m unittest -v tests.test_flat_paper_recovery_gate tests.test_flat_paper_recovery_transition tests.test_jasmy_flat_handoff_proof
