name: FLAT PAPER recovery evidence tests
on:
  pull_request:
    paths:
      - 'tools/flat_paper_recovery_gate.py'
      - 'tools/flat_paper_recovery_transition.py'
      - 'tests/test_flat_paper_recovery_gate.py'
      - 'tests/test_flat_paper_recovery_transition.py'
      - '.github/workflows/flat-paper-recovery-gate.yml'
  workflow_dispatch:

jobs:
  flat-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime import dependency
        run: python -m pip install requests
      - name: Compile offline gate
        run: python -m py_compile tools/flat_paper_recovery_gate.py tools/flat_paper_recovery_transition.py tests/test_flat_paper_recovery_gate.py tests/test_flat_paper_recovery_transition.py
      - name: Run fail-closed synthetic tests
        run: python -m unittest -v tests.test_flat_paper_recovery_gate tests.test_flat_paper_recovery_transition
