name: TEMP P0.4 review hardening

on:
  push:
    branches:
      - robot-v0-1-safety-p0-4
    paths:
      - ".github/workflows/temp-p0-4-reviewfix.yml"

permissions:
  contents: write

jobs:
  harden-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: robot-v0-1-safety-p0-4
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply review hardening
        run: python .github/temp_p0_4_reviewfix.py
      - name: Install focused dependencies
        run: python -m pip install pytest requests==2.34.2 PySocks==1.7.1 websocket-client==1.9.0
      - name: Compile P0.4 surface
        run: >-
          python -m py_compile
          terminal/application/robot_breakout_monitor.py
          terminal/runtime/paper_runtime.py
          terminal/runtime/paper_http_server.py
          tests/test_robot_breakout_monitor.py
          tests/test_terminal_paper_runtime.py
          tests/test_terminal_paper_http.py
      - name: Run Robot monitor and deterministic PAPER acceptance
        run: >-
          python -m unittest -v
          tests.test_robot_breakout_monitor
          tests.test_robot_paper_acceptance
      - name: Run P0.4 runtime coverage regressions
        run: >-
          python -m pytest -q
          tests/test_terminal_paper_runtime.py
          -k "retest_detected_candidate_is_covered or robot_entry_limit_is_covered or robot_protection_coverage_symbols"
      - name: Run ordered coverage-manager regressions
        run: >-
          python -m pytest -q
          tests/test_terminal_paper_http.py
          -k "robot_protection_coverage_manager"
      - name: Check scoped diff
        shell: bash
        run: |
          python - <<'PY'
          import subprocess
          out = subprocess.check_output(["git", "status", "--porcelain"], text=True)
          changed = {line[3:] for line in out.splitlines() if line.strip()}
          expected = {
              "terminal/runtime/paper_runtime.py",
              "terminal/runtime/paper_http_server.py",
              "tests/test_terminal_paper_runtime.py",
          }
          if changed != expected:
              raise SystemExit(f"unexpected P0.4 review-fix scope: {sorted(changed)}")
          PY
          git diff --check
      - name: Commit and push review hardening
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add terminal/runtime/paper_runtime.py terminal/runtime/paper_http_server.py tests/test_terminal_paper_runtime.py
          git commit -m "fix: harden P0.4 pre-fill coverage scope"
          git push origin HEAD:robot-v0-1-safety-p0-4
