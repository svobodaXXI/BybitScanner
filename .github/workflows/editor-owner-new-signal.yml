name: Editor owner new-signal proposal

on:
  pull_request:
    paths:
      - "owner_signal_proposal.py"
      - "retrospective_signal_bars.py"
      - "geometry_feedback_store.py"
      - "geometry_feedback_export.py"
      - "geometry_feedback_learning_report.py"
      - "terminal/frontend/src/geometryFeedback/geometryReviewDraft.ts"
      - "terminal/frontend/src/geometryFeedback/signalChartBridge.ts"
      - "tests/test_geometry_feedback_retrospective.py"
      - "terminal/runtime/paper_http_server.py"
      - "terminal/frontend/src/components/ChartPanel.tsx"
      - "terminal/frontend/src/app/App.tsx"
      - "terminal/frontend/src/geometryFeedback/ownerSignalDraft.ts"
      - "terminal/frontend/src/geometryFeedback/ownerSignalDraft.test.ts"
      - "tests/test_owner_signal_proposal.py"
      - "tests/test_geometry_feedback_http_route.py"
      - ".github/workflows/editor-owner-new-signal.yml"

permissions:
  contents: read

jobs:
  isolated-precheck:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install only offline review dependencies
        run: python -m pip install pytest==8.4.2 numpy==2.5.1 pandas==3.0.5 requests==2.34.2
      - name: Run isolated owner new-signal proposal tests
        run: python -m pytest -q tests/test_owner_signal_proposal.py tests/test_geometry_feedback_export.py tests/test_geometry_feedback_learning_report.py tests/test_geometry_feedback_retrospective.py tests/test_geometry_feedback_http_route.py
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: terminal/frontend/package-lock.json
      - name: Locked frontend install
        working-directory: terminal/frontend
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify Editor UI build and proposal validator
        working-directory: terminal/frontend
        run: |
          npm run build
          npx vitest run src/geometryFeedback/ownerSignalDraft.test.ts src/geometryFeedback/geometryReviewDraft.test.ts src/geometryFeedback/signalChartBridge.test.ts
