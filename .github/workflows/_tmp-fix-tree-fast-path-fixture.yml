name: Temporary fix tree fast path fixture

on:
  push:
    branches:
      - workflow/tree-verification-fast-path

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: workflow/tree-verification-fast-path
      - name: Make Python isolation fixture mirror project ignores
        shell: python
        run: |
          from pathlib import Path

          path = Path('.github/workflows/_tmp-tree-verification-fast-path.yml')
          text = path.read_text(encoding='utf-8')
          worker_line = '                  (root / "worker.py").write_text("VALUE = 1\\\\n", encoding="utf-8")\n'
          ignore_line = '                  (root / ".gitignore").write_text("__pycache__/\\\\n", encoding="utf-8")\n'
          add_line = '                      ("git", "add", ".gitattributes", "task.txt", "docs.txt", "README.md", "worker.py"),\n'
          add_with_ignore = '                      ("git", "add", ".gitattributes", ".gitignore", "task.txt", "docs.txt", "README.md", "worker.py"),\n'
          assert worker_line in text
          assert add_line in text
          text = text.replace(worker_line, worker_line + ignore_line, 1)
          text = text.replace(add_line, add_with_ignore, 1)
          path.write_text(text, encoding='utf-8')
      - name: Commit fixture correction and remove fixer
        run: |
          rm .github/workflows/_tmp-fix-tree-fast-path-fixture.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/_tmp-tree-verification-fast-path.yml .github/workflows/_tmp-fix-tree-fast-path-fixture.yml
          git commit -m "chore: fix tree fast path test fixture"
          git push origin HEAD:workflow/tree-verification-fast-path
