name: Robot position card checks

on:
  pull_request:
    paths:
      - "robot_position_chart.py"
      - "robot_position_view.py"
      - "tests/test_robot_position_card.py"
      - "tests/test_robot_position_box_grid.py"
      - ".github/workflows/robot-position-card-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  position-card:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install chart dependencies
        run: >-
          python -m pip install
          pandas==3.0.5
          numpy==2.5.1
          matplotlib==3.11.1
          mplfinance==0.12.10b0
      - name: Run position card tests
        run: python -m unittest -v tests.test_robot_position_card tests.test_robot_position_box_grid
