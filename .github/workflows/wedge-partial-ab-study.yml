name: Wedge partial 25% versus original (isolated research)

on:
  pull_request:
    paths:
      - "research/simulator_v2/wedge_partial_ab_ci.py"
      - "tests/test_historical_wedge_partial_ab.py"
      - ".github/workflows/wedge-partial-ab-study.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research:
    # Only this one explicitly selected research PR; don't download historical
    # archives for unrelated PRs or claim API network access from GitHub.
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'research/wedge-partial-be-github-20261113'
    runs-on: ubuntu-latest
    timeout-minutes: 22
    strategy:
      fail-fast: false
      matrix:
        include:
          - segment: nov07-10
            first_day: "2026-11-07"
            days: "4"
          - segment: nov12
            first_day: "2026-11-12"
            days: "1"
    env:
      WEDGE_AB_START_DAY: ${{ matrix.first_day }}
      WEDGE_AB_DAYS: ${{ matrix.days }}
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install isolated Scanner analysis dependencies
        run: python -m pip install pandas==2.2.3 numpy==2.1.3
      - name: Causal offline regression
        run: python -m unittest discover -s tests -p 'test_historical_wedge_partial_ab.py' -v
      - name: Official public Bybit archive and native Scanner/Robot paired study
        run: python -m research.simulator_v2.wedge_partial_ab_ci
      - name: Save result including a precise failure receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: icnt-wedge-partial-ab-${{ matrix.segment }}
          path: wedge_ab_result.json
          if-no-files-found: warn
          retention-days: 7
