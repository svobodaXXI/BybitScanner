name: TEMP P0.2 implementation

on:
  push:
    branches:
      - robot-v0-1-safety-p0-2
    paths:
      - ".github/temp_p0_2_patch.py"
      - ".github/workflows/temp-p0-2-implementation.yml"

permissions:
  contents: write

jobs:
  patch-test-push:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: robot-v0-1-safety-p0-2
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply scoped P0.2 patch
        run: python .github/temp_p0_2_patch.py
      - name: Install focused dependencies
        run: python -m pip install requests==2.34.2 PySocks==1.7.1 websocket-client==1.9.0
      - name: Compile scoped surface
        run: python -m py_compile terminal/application/robot_admission.py terminal/application/robot_breakout_monitor.py tests/test_robot_admission.py tests/test_robot_breakout_monitor.py
      - name: Run P0.2 focused tests
        run: python -m unittest -v tests.test_robot_admission tests.test_robot_breakout_monitor
      - name: Check exact scope and whitespace
        shell: bash
        run: |
          git diff --check
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' terminal/application/robot_admission.py terminal/application/robot_breakout_monitor.py tests/test_robot_admission.py tests/test_robot_breakout_monitor.py | sort)"
          test "$changed" = "$expected"
      - name: Commit and push P0.2
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add terminal/application/robot_admission.py terminal/application/robot_breakout_monitor.py tests/test_robot_admission.py tests/test_robot_breakout_monitor.py
          git commit -m "fix: enforce single Robot exposure owner per symbol"
          git push origin HEAD:robot-v0-1-safety-p0-2
