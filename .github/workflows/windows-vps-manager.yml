name: Windows VPS Manager smoke
on:
  pull_request:
    paths:
      - "tools/windows_vps_manager.py"
      - "tools/manager_self_update.py"
      - "research/local_replay_viewer/desktop_update.py"
      - "tools/Запустить VPS Manager.cmd"
      - "tests/test_windows_vps_manager.py"
      - "tools/vps_owner_control.py"
      - "tests/test_vps_owner_control.py"
      - ".github/workflows/windows-vps-manager.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-mvp:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check Tkinter
        run: python -c "import tkinter; print('Tkinter import OK')"
      - name: Compile utility
        run: python -m py_compile tools/windows_vps_manager.py tools/vps_owner_control.py
      - name: Run isolated safety tests
        run: python -m unittest discover -s tests -p test_windows_vps_manager.py -v
      - name: Verify detached owner protocol
        run: python -m unittest discover -s tests -p test_vps_owner_control.py -v
      - name: Parse local update helper with native PowerShell (no execution)
        shell: pwsh
        run: |
          python -c "from tools.manager_self_update import HELPER; open('manager_update.ps1','w',encoding='ascii').write(HELPER)"
          $tokens=$null
          $errors=$null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'manager_update.ps1'),[ref]$tokens,[ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { throw 'LOCAL_UPDATE_HELPER_SYNTAX_INVALID' }
      - name: Build portable Windows EXE
        run: |
          python -m pip install pyinstaller==6.16.0
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name BybitScanner-VPS-Manager tools/windows_vps_manager.py
      - name: Verify EXE exists
        shell: pwsh
        run: |
          if (!(Test-Path "dist/BybitScanner-VPS-Manager.exe")) { throw "Missing Windows executable" }
          Get-Item "dist/BybitScanner-VPS-Manager.exe" | Select-Object Name,Length
      - name: Upload portable EXE
        uses: actions/upload-artifact@v4
        with:
          name: BybitScanner-VPS-Manager-Windows
          path: dist/BybitScanner-VPS-Manager.exe
          if-no-files-found: error
          retention-days: 14
