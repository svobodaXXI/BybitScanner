name: Ikigai Box stale notification gate

on:
  pull_request:
    paths:
      - "geometry/ikigai_box_completion.py"
      - "tests/test_ikigai_box_completion.py"
      - ".github/workflows/ikigai-box-stale.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-box-stale:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install offline test dependency
        run: python -m pip install pandas==3.0.5
      - name: Compile isolated stale gate and regression
        run: python -m py_compile geometry/ikigai_box_completion.py tests/test_ikigai_box_completion.py
      - name: Verify spent Box signals are suppressed without network
        run: python -m unittest -v tests.test_ikigai_box_completion
