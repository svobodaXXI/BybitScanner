name: TEMP P0.5 final protected verification

on:
  push:
    branches:
      - robot-v0-1-safety-p0-5
    paths:
      - ".github/workflows/temp-p0-5-final-verify.yml"

permissions:
  contents: write

jobs:
  final-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: robot-v0-1-safety-p0-5
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install repository test dependencies
        run: >-
          python -m pip install
          pytest
          requests==2.34.2
          PySocks==1.7.1
          websocket-client==1.9.0
          pandas
          numpy
          matplotlib
          mplfinance
          pybit
          pycryptodome
      - name: Full Python repository regression
        run: python -m pytest -q tests
      - name: Protected task finish on exact P0.5 production diff
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main robot-v0-1-safety-p0-5
          verify_branch="p0-5-protected-${GITHUB_RUN_ID}"
          task_id="p0-5-${GITHUB_RUN_ID}"
          git switch -c "$verify_branch" origin/main
          git push -u origin HEAD:"$verify_branch"
          python -m tools.dev.task start \
            --task-id "$task_id" \
            --intent "Robot Safety P0.5 evidence-based reconcile_robot" \
            --path terminal/api/models.py \
            --path terminal/application/robot_control.py \
            --path terminal/application/robot_recovery.py \
            --path terminal/runtime/paper_http_server.py \
            --path terminal/runtime/paper_runtime.py \
            --path tests/test_robot_control.py \
            --path tests/test_robot_recovery_coordinator.py \
            --path tests/test_terminal_paper_runtime.py
          git diff --binary origin/main...origin/robot-v0-1-safety-p0-5 -- \
            terminal/api/models.py \
            terminal/application/robot_control.py \
            terminal/application/robot_recovery.py \
            terminal/runtime/paper_http_server.py \
            terminal/runtime/paper_runtime.py \
            tests/test_robot_control.py \
            tests/test_robot_recovery_coordinator.py \
            tests/test_terminal_paper_runtime.py | git apply
          python -m tools.dev.task finish --task "$task_id"
          git reset --hard HEAD
          git switch --detach origin/robot-v0-1-safety-p0-5
          git push origin --delete "$verify_branch"
      - name: Final scoped diff check
        shell: bash
        run: |
          set -euo pipefail
          git diff --check origin/main...origin/robot-v0-1-safety-p0-5
          mapfile -t changed < <(git diff --name-only origin/main...origin/robot-v0-1-safety-p0-5 | sort)
          expected=(
            terminal/api/models.py
            terminal/application/robot_control.py
            terminal/application/robot_recovery.py
            terminal/runtime/paper_http_server.py
            terminal/runtime/paper_runtime.py
            tests/test_robot_control.py
            tests/test_robot_recovery_coordinator.py
            tests/test_terminal_paper_runtime.py
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          if [[ "${changed[*]}" != "${expected_sorted[*]}" ]]; then
            printf 'Unexpected final P0.5 diff:\n%s\n' "${changed[*]}"
            exit 1
          fi
