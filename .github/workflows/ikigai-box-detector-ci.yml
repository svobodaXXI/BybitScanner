name: Ikigai Box detector

on:
  pull_request:
    paths:
      - "geometry/ikigai_box.py"
      - "geometry/ikigai_box_chart.py"
      - "tests/test_ikigai_box_detector.py"
      - "tests/test_ikigai_box_chart.py"
      - ".github/workflows/ikigai-box-detector-ci.yml"

permissions:
  contents: read

jobs:
  offline-geometry:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependency
        run: python -m pip install pandas==3.0.5 numpy==2.5.1 matplotlib==3.11.1 mplfinance==0.12.10b0 pillow==12.3.0
      - name: Compile detector and run focused tests
        run: |
          python -m py_compile geometry/ikigai_box.py geometry/ikigai_box_chart.py tests/test_ikigai_box_detector.py tests/test_ikigai_box_chart.py
          python -m unittest -v tests.test_ikigai_box_detector tests.test_ikigai_box_chart
