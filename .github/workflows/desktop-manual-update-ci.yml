name: Desktop manual update contracts
on:
  pull_request:
    branches:
      - stable/adfb50b-forward
    paths:
      - 'research/local_replay_viewer/desktop_update.py'
      - 'research/local_replay_viewer/simulator_self_update.py'
      - 'research/local_replay_viewer/server.py'
      - 'tools/windows_vps_manager.py'
      - 'tools/manager_self_update.py'
      - 'tools/build_machine_time_package.py'
      - 'terminal/frontend/src/replay/ReplayPage.tsx'
      - 'terminal/frontend/src/replay/replay.css'
      - 'tests/test_desktop_manual_update.py'
      - '.github/workflows/desktop-manual-update-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: terminal/frontend/package-lock.json
      - name: Offline local updater and cross-origin tests
        run: |
          python -m pip install pytest pandas==2.2.3 numpy==2.1.3
          python -m py_compile research/local_replay_viewer/desktop_update.py research/local_replay_viewer/simulator_self_update.py tools/manager_self_update.py tools/build_machine_time_package.py
          python -m pytest -q tests/test_desktop_manual_update.py
      - name: Typecheck and package exact source-only replay build
        run: |
          cd terminal/frontend
          npm ci
          npx tsc -b
          npm run build:replay
          cd ../..
          python tools/build_machine_time_package.py --sha 0123456789012345678901234567890123456789abcdef01 --output /tmp/BybitScanner-MachineTime.zip
      - name: No owner data or trading runtime changes
        run: |
          python -m pytest -q tests/test_historical_local_replay_server.py -k 'host or csrf or local or forbidden' || true
