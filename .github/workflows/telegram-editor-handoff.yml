name: Telegram Editor verified handoff
on:
  pull_request:
    paths:
      - 'telegram_review.py'
      - 'workspace_telegram_handoff.py'
      - 'tests/test_workspace_telegram_handoff.py'
      - '.github/workflows/telegram-editor-handoff.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  handoff:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests
      - run: python -m py_compile telegram_review.py workspace_telegram_handoff.py
      - run: python -m unittest -v tests.test_workspace_telegram_handoff tests.test_telegram_review_authorization
