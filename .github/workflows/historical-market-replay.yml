name: Historical market replay (offline)

on:
  pull_request:
    paths:
      - "research/historical_market_replay.py"
      - "research/historical_candle_feed.py"
      - "research/wilder_dmi.py"
      - "research/causal_trend_geometry.py"
      - "research/local_replay_viewer/**"
      - "research/export_historical_replay.py"
      - "research/simulation_runs/.gitignore"
      - "tests/test_historical_replay_export.py"
      - "tests/test_historical_market_replay.py"
      - "tests/test_historical_candle_feed.py"
      - "tests/test_historical_dmi.py"
      - "tests/test_historical_trend_geometry.py"
      - "tests/test_historical_local_replay_server.py"
      - ".github/workflows/historical-market-replay.yml"
      - "terminal/frontend/src/replay/**"
      - "terminal/frontend/replay.html"
      - "terminal/frontend/vite.config.ts"
      - "terminal/frontend/vite.replay.config.ts"
      - "terminal/frontend/package.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-replay-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify isolated replay and causal timeframe tests
        run: python -m unittest discover -s tests -p 'test_historical_*.py' -v

  standalone-replay-viewer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: terminal/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: terminal/frontend/package-lock.json
      - name: Install locked frontend dependencies
        run: npm ci
      - name: Validate standalone replay model
        run: npm run test -- src/replay/replayModel.test.ts
      - name: Build main terminal without experimental simulator
        run: |
          npm run build
          test ! -e dist/replay.html
      - name: Build standalone Windows simulator viewer separately
        run: npm run build:replay
      - name: Assemble self-contained local Windows simulator package
        run: |
          mkdir -p "$RUNNER_TEMP/machine-time/research"
          cp ../../research/local_replay_viewer/server.py "$RUNNER_TEMP/machine-time/server.py"
          cp ../../research/local_replay_viewer/START_LOCAL.cmd "$RUNNER_TEMP/machine-time/START_LOCAL.cmd"
          cp ../../research/local_replay_viewer/README.txt "$RUNNER_TEMP/machine-time/README.txt"
          cp -r ../../research/local_replay_viewer/dist "$RUNNER_TEMP/machine-time/dist"
          cp ../../research/export_historical_replay.py ../../research/historical_candle_feed.py ../../research/historical_market_replay.py ../../research/wilder_dmi.py ../../research/causal_trend_geometry.py "$RUNNER_TEMP/machine-time/research/"
          python "$RUNNER_TEMP/machine-time/server.py" --check
      - name: Attach local-only Windows viewer for manual PC acceptance
        uses: actions/upload-artifact@v4
        with:
          name: machine-time-local-windows
          path: ${{ runner.temp }}/machine-time/
          if-no-files-found: error
          retention-days: 7
