name: Historical market replay (offline)

on:
  pull_request:
    paths:
      - "research/historical_market_replay.py"
      - "research/h017_local_risk.py"
      - "research/h017_blue_open_preview.py"
      - "research/h017_blue_execution_scenario.py"
      - "research/historical_candle_feed.py"
      - "research/wilder_dmi.py"
      - "research/causal_trend_geometry.py"
      - "research/local_replay_viewer/**"
      - "research/export_historical_replay.py"
      - "research/simulation_runs/.gitignore"
      - "tests/test_historical_replay_export.py"
      - "tests/test_historical_market_replay.py"
      - "tests/test_historical_h017_local_risk.py"
      - "tests/test_historical_h017_blue_preview.py"
      - "tests/test_historical_h017_blue_execution_scenario.py"
      - "tests/test_historical_candle_feed.py"
      - "tests/test_historical_dmi.py"
      - "tests/test_historical_trend_geometry.py"
      - "tests/test_historical_local_replay_server.py"
      - "tests/test_historical_demo_dmi_fixture.py"
      - ".github/workflows/historical-market-replay.yml"
      - "terminal/frontend/src/replay/**"
      - "terminal/frontend/replay.html"
      - "terminal/frontend/vite.config.ts"
      - "terminal/frontend/vite.replay.config.ts"
      - "terminal/frontend/package.json"
      - "terminal/frontend/e2e/local-replay-browser.mjs"
      - "terminal/frontend/e2e/real-reversal-browser.mjs"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-replay-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify isolated replay and causal timeframe tests
        run: python -m unittest discover -s tests -p 'test_historical_*.py' -v

  standalone-replay-viewer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: terminal/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: terminal/frontend/package-lock.json
      - name: Install locked frontend dependencies
        run: npm ci
      - name: Validate standalone replay model and Telegram-style execution markers
        run: npm run test -- src/replay/replayModel.test.ts src/replay/executionMarkers.test.ts
      - name: Build main terminal without experimental simulator
        run: |
          npm run build
          test ! -e dist/replay.html
      - name: Build standalone Windows simulator viewer separately
        run: npm run build:replay
      - name: Assemble self-contained local Windows simulator package
        run: |
          mkdir -p "$RUNNER_TEMP/machine-time/research"
          cp ../../research/local_replay_viewer/server.py "$RUNNER_TEMP/machine-time/server.py"
          cp ../../research/local_replay_viewer/START_LOCAL.cmd "$RUNNER_TEMP/machine-time/START_LOCAL.cmd"
          cp ../../research/local_replay_viewer/README.txt "$RUNNER_TEMP/machine-time/README.txt"
          cp ../../research/local_replay_viewer/smoke_package.py "$RUNNER_TEMP/machine-time/smoke_package.py"
          cp -r ../../research/local_replay_viewer/dist "$RUNNER_TEMP/machine-time/dist"
          cp ../../research/export_historical_replay.py ../../research/historical_candle_feed.py ../../research/historical_market_replay.py ../../research/h017_local_risk.py ../../research/h017_blue_open_preview.py ../../research/wilder_dmi.py ../../research/causal_trend_geometry.py "$RUNNER_TEMP/machine-time/research/"
          python "$RUNNER_TEMP/machine-time/server.py" --check
      - name: Select preinstalled Chrome or install Chromium
        run: |
          if command -v google-chrome >/dev/null; then
            echo "LOCAL_REPLAY_CHROME=$(command -v google-chrome)" >> "$GITHUB_ENV"
          else
            npx playwright install chromium
          fi
      - name: Verify packaged viewer in real browser with mock public history
        run: node e2e/local-replay-browser.mjs
        env:
          LOCAL_REPLAY_E2E_SCREENSHOTS: ${{ runner.temp }}/local-replay-e2e
      - name: Upload screenshot proof for visual inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: machine-time-browser-proof
          path: ${{ runner.temp }}/local-replay-e2e/
          if-no-files-found: ignore
          retention-days: 7
      - name: Attach local-only Windows viewer for manual PC acceptance
        uses: actions/upload-artifact@v4
        with:
          name: machine-time-local-windows
          path: ${{ runner.temp }}/machine-time/
          if-no-files-found: error
          retention-days: 7

  windows-local-package-smoke:
    runs-on: windows-latest
    needs: standalone-replay-viewer
    timeout-minutes: 7
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: machine-time-local-windows
          path: machine-time
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify extracted Windows package starts and serves local assets
        shell: pwsh
        working-directory: machine-time
        run: |
          python -B server.py --check
          python -B smoke_package.py

  real-bybit-h017-readonly-acceptance:
    # A single research PR trial, or a manual rerun when separately requested.
    # No scheduled network cost and no synthetic fallbacks.
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && (github.head_ref == 'test/h017-real-bybit-grass-readonly-20261105' || github.head_ref == 'feature/h017-crossings-first-touch-study-20261105' || github.head_ref == 'feature/h017-blue-open-costed-counterfactual-20261105' || (github.head_ref == 'docs/h017-purple-prior-replay-20261105' || (github.head_ref == 'feature/h017-replay-chart-controls-icons-20261106' || github.head_ref == 'feature/h017-undo-persistent-geometry-20261106'))))
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check bounded official GRASSUSDT H1 prior and reversal windows
        run: |
          python -m research.h017_real_bybit_readonly_acceptance
          python -m research.h017_real_bybit_readonly_acceptance --start 2026-09-01 --end 2026-09-08
          python -m research.h017_real_bybit_readonly_acceptance --start 2026-08-20 --end 2026-08-27 --require-complete-reversal --output-json "$RUNNER_TEMP/real-h1-august.json"
      - name: Export audited real MARKET_ONLY JSON for browser proof
        uses: actions/upload-artifact@v4
        with:
          name: machine-time-real-h1-august
          path: ${{ runner.temp }}/real-h1-august.json
          if-no-files-found: error
          retention-days: 7

  real-h1-browser-proof:
    # Runs only on the isolated H-017 draft PR. Both independently tested
    # artifacts must exist; never download any private/PAPER account history.
    if: github.event_name == 'pull_request' && (github.head_ref == 'docs/h017-purple-prior-replay-20261105' || (github.head_ref == 'feature/h017-replay-chart-controls-icons-20261106' || github.head_ref == 'feature/h017-undo-persistent-geometry-20261106'))
    needs: [standalone-replay-viewer, real-bybit-h017-readonly-acceptance]
    runs-on: ubuntu-latest
    timeout-minutes: 9
    defaults:
      run:
        working-directory: terminal/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: machine-time-local-windows
          path: ${{ runner.temp }}/machine-time
      - uses: actions/download-artifact@v4
        with:
          name: machine-time-real-h1-august
          path: ${{ runner.temp }}/real-h1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: terminal/frontend/package-lock.json
      - name: Install locked browser test dependencies
        run: npm ci
      - name: Select preinstalled Chrome or install Chromium
        run: |
          if command -v google-chrome >/dev/null; then
            echo "LOCAL_REPLAY_CHROME=$(command -v google-chrome)" >> "$GITHUB_ENV"
          else
            npx playwright install chromium
          fi
      - name: Render three audited real H1 prior breaks and opposite trends in Chromium
        run: node e2e/real-reversal-browser.mjs
        env:
          LOCAL_REPLAY_PACKAGED_SERVER: ${{ runner.temp }}/machine-time/server.py
          LOCAL_REPLAY_REAL_ARCHIVE: ${{ runner.temp }}/real-h1/real-h1-august.json
          LOCAL_REPLAY_E2E_SCREENSHOTS: ${{ runner.temp }}/real-h1-screens
      # The verified public archive used in browser proof must ship together
      # with the exact tested viewer: one artifact for Windows owner acceptance,
      # not two independently downloaded ZIPs or any private/PAPER data.
      - name: Assemble single real-history Windows acceptance package
        run: |
          cp "$RUNNER_TEMP/real-h1/real-h1-august.json" "$RUNNER_TEMP/machine-time/real-h1-august.json"
          cmp "$RUNNER_TEMP/real-h1/real-h1-august.json" "$RUNNER_TEMP/machine-time/real-h1-august.json"
          test -f "$RUNNER_TEMP/machine-time/dist/replay.html"
          python "$RUNNER_TEMP/machine-time/server.py" --check
          python "$RUNNER_TEMP/machine-time/smoke_package.py"
      - name: Verify real GRASSUSDT is the default first screen in final package
        run: node e2e/bundled-h1-autostart-browser.mjs
        env:
          LOCAL_REPLAY_PACKAGED_SERVER: ${{ runner.temp }}/machine-time/server.py
      - name: Upload one verified Windows package with real H1 archive
        uses: actions/upload-artifact@v4
        with:
          name: machine-time-windows-h017-real-history
          path: ${{ runner.temp }}/machine-time/
          if-no-files-found: error
          retention-days: 7
      - name: Attach three real break and opposite-line screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: machine-time-real-h1-browser-proof
          path: ${{ runner.temp }}/real-h1-screens/
          if-no-files-found: warn
          retention-days: 7
