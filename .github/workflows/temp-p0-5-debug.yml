name: TEMP P0.5 runtime failure capture

on:
  push:
    branches:
      - robot-v0-1-safety-p0-5
    paths:
      - ".github/workflows/temp-p0-5-debug.yml"

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: robot-v0-1-safety-p0-5
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python .github/temp_p0_5_patch.py
      - run: python -m pip install pytest requests==2.34.2 PySocks==1.7.1 websocket-client==1.9.0
      - name: Capture runtime test output
        shell: bash
        run: |
          set +e
          python -m pytest -vv tests/test_terminal_paper_runtime.py -k "robot_reconcile or reconcile_robot" > .github/p0_5_runtime_output.txt 2>&1
          code=$?
          echo "EXIT_CODE=$code" >> .github/p0_5_runtime_output.txt
          cat .github/p0_5_runtime_output.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/p0_5_runtime_output.txt
          git commit -m "chore: capture P0.5 runtime failure"
          git push origin HEAD:robot-v0-1-safety-p0-5
