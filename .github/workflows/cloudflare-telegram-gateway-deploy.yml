name: Cloudflare Telegram Gateway deploy

# GitHub merge must never publish a new Gateway without separate owner approval.
# workflow_dispatch on the reviewed stable branch is the sole production entrypoint.
on:
  pull_request:
    paths:
      - 'deploy/telegram_gateway/cloudflare_proxy_worker.mjs'
      - 'deploy/telegram_gateway/worker.mjs'
      - 'deploy/telegram_gateway/wrangler.toml'
      - 'tests/test_telegram_cloudflare_direct.mjs'
      - '.github/workflows/cloudflare-telegram-gateway-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-telegram-gateway-production
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify direct Cloudflare entrypoint and focused Gateway regressions
        run: |
          node --check deploy/telegram_gateway/cloudflare_proxy_worker.mjs
          node --check deploy/telegram_gateway/worker.mjs
          node --test tests/test_telegram_cloudflare_direct.mjs tests/test_telegram_gateway_worker.mjs

  deploy:
    needs: verify
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/stable/adfb50b-forward'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: cloudflare-telegram-gateway
    steps:
      - name: Checkout reviewed stable source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Require Cloudflare deployment credentials
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CF_TOKEN" || { echo 'Missing Cloudflare deployment token'; exit 1; }
          test -n "$CF_ACCOUNT" || { echo 'Missing Cloudflare account ID'; exit 1; }
      - name: Deploy direct Gateway to existing Worker (requires configured private bindings)
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            deploy --config deploy/telegram_gateway/wrangler.toml
      - name: Verify only public availability; not Telegram stream ownership
        run: |
          curl --fail --silent --show-error --max-time 12 \
            https://bybitscanner-gateway.svoboda21vekaru.workers.dev/health \
            | grep -Fq '"delivery_verified":false'
