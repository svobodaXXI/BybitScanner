name: TEMP P0.3 final verification

on:
  push:
    branches:
      - robot-v0-1-safety-p0-3
    paths:
      - ".github/workflows/temp-p0-3-final-verify.yml"

permissions:
  contents: write

jobs:
  final-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: robot-v0-1-safety-p0-3
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply restart regression review fix
        run: python .github/temp_p0_3_reviewfix.py
      - name: Install focused dependencies
        run: python -m pip install requests==2.34.2 PySocks==1.7.1 websocket-client==1.9.0
      - name: Compile P0.3 surface
        run: >-
          python -m py_compile
          terminal/application/robot_breakout_monitor.py
          tests/test_robot_breakout_monitor.py
          tests/test_robot_paper_acceptance.py
      - name: Run focused P0.3 verification
        run: >-
          python -m unittest -v
          tests.test_robot_breakout_monitor
          tests.test_robot_paper_acceptance
      - name: Check scoped diff
        shell: bash
        run: |
          python - <<'PY'
          import subprocess
          out = subprocess.check_output(["git", "status", "--porcelain"], text=True)
          changed = {line[3:] for line in out.splitlines() if line.strip()}
          expected = {"tests/test_robot_breakout_monitor.py"}
          if changed != expected:
              raise SystemExit(f"unexpected P0.3 review-fix scope: {sorted(changed)}")
          PY
          git diff --check
      - name: Commit and push restart regression
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_robot_breakout_monitor.py
          git commit -m "test: cover P0.3 restart after partial fill"
          git push origin HEAD:robot-v0-1-safety-p0-3
