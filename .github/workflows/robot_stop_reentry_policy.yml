name: Robot STOP reentry policy tests

on:
  pull_request:
    paths:
      - 'terminal/application/stop_reentry_*.py'
      - 'terminal/application/robot_reentry_adapter.py'
      - 'terminal/application/robot_autopilot_shadow.py'
      - 'terminal/application/robot_admission.py'
      - 'terminal/persistence/schema.py'
      - 'terminal/persistence/sqlite_store.py'
      - 'terminal/diary/reentry.py'
      - 'tests/test_stop_reentry_*.py'
      - '.github/workflows/robot_stop_reentry_policy.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-policy:
    name: Pure retry contract (no PAPER runtime)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install focused test runner
        run: python -m pip install pytest
      - name: Verify pure STOP and logical setup policy
        run: |
          python -m pytest -q \
            tests/test_stop_reentry_policy.py \
            tests/test_stop_reentry_campaign.py \
            tests/test_stop_reentry_setup.py \
            tests/test_stop_reentry_diary.py \
            tests/test_stop_reentry_reservation.py \
            tests/test_stop_reentry_admission_atomic.py \
            tests/test_stop_reentry_adapter.py
