name: Telegram market card
on:
  pull_request:
    branches: [stable/adfb50b-forward]
    paths:
      - telegram_market.py
      - telegram_monitoring.py
      - tests/test_telegram_monitoring.py
      - .github/workflows/telegram-market.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  market-card:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install existing Telegram test dependencies
        run: python -m pip install requests==2.34.2 PySocks==1.7.1 websocket-client==1.9.0 pandas==3.0.5 numpy==2.5.1 matplotlib==3.11.1 mplfinance==0.12.10b0 six==1.17.0
      - name: Compile market and owner Telegram handler
        run: python -m py_compile telegram_market.py telegram_monitoring.py tests/test_telegram_monitoring.py
      - name: Verify market card and owner menu cases
        run: python -m unittest -v tests.test_telegram_monitoring.TelegramMarketTests tests.test_telegram_monitoring.TelegramMonitoringTests.test_menu_tracks_external_state_preserving_monitoring
