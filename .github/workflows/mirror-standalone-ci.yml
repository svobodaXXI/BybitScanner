name: MIRROR standalone PAPER acceptance

# Isolated synthetic market / temporary PAPER DB only; never starts live services.
on:
  pull_request:
    paths:
      - "mirror_scanner.py"
      - "tests/test_mirror_scanner_integration.py"
      - "pattern_freshness.py"
      - "tests/test_pattern_freshness.py"
      - "tests/test_mirror_standalone_paper_e2e.py"
      - ".github/workflows/mirror-standalone-ci.yml"
  workflow_dispatch:

concurrency:
  group: mirror-standalone-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  standalone-paper:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install test imports (no Bybit connectivity or credentials)
        run: >-
          python -m pip install
          requests==2.34.2
          PySocks==1.7.1
          websocket-client==1.9.0
          pandas==3.0.5
          numpy==2.5.1
          matplotlib==3.11.1
          mplfinance==0.12.10b0
          pytest==9.1.1
      - name: Compile MIRROR source and acceptance
        run: >-
          python -m py_compile
          mirror_scanner.py
          pattern_freshness.py
          tests/test_pattern_freshness.py
          tests/test_mirror_standalone_paper_e2e.py
      - name: Verify causal wick-extremum supersession
        run: python -m pytest -q tests/test_mirror_scanner_integration.py -k "extremum or wick_sweep"
      - name: Full synthetic MIRROR standalone PAPER E2E and regression suite
        run: python -m unittest -v tests.test_pattern_freshness tests.test_mirror_standalone_paper_e2e
