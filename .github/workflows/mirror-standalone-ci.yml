name: MIRROR standalone PAPER acceptance

# Isolated synthetic market / temporary PAPER DB only; never starts live services.
on:
  pull_request:
    paths:
      - "mirror_scanner.py"
      - "mirror_levels/levels.py"
      - "mirror_levels/tracker.py"
      - "tests/test_mirror_levels.py"
      - "geometry/broadening.py"
      - "tests/test_broadening_detector.py"
      - "geometry/reversal_patterns.py"
      - "geometry/diamond.py"
      - "tests/test_diamond_detector.py"
      - "geometry/channel_preview.py"
      - "tests/test_channel_preview.py"
      - "geometry/naked_breakout_return.py"
      - "tests/test_naked_breakout_return.py"
      - "mirror_retest_projection.py"
      - "tests/test_mirror_retest_projection.py"
      - "tests/fixtures/mirror_integration_5/journal_B.jsonl"
      - "tests/test_shared_reversal_candles.py"
      - "main.py"
      - "tests/test_scanner_pass_progress.py"
      - "tests/test_horn_scanner.py"
      - "tests/test_mirror_scanner_integration.py"
      - "pattern_freshness.py"
      - "tests/test_pattern_freshness.py"
      - "tests/test_mirror_standalone_paper_e2e.py"
      - "research/simulator_v2/robot_sandbox.py"
      - "tests/test_simulator_v2_box_lifecycle.py"
      - "tests/test_simulator_v2_mirror_intake.py"
      - ".github/workflows/mirror-standalone-ci.yml"
  workflow_dispatch:

concurrency:
  group: mirror-standalone-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  standalone-paper:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install test imports (no Bybit connectivity or credentials)
        run: >-
          python -m pip install
          requests==2.34.2
          PySocks==1.7.1
          websocket-client==1.9.0
          pandas==3.0.5
          numpy==2.5.1
          matplotlib==3.11.1
          mplfinance==0.12.10b0
          pytest==9.1.1
          six==1.17.0
      - name: Compile MIRROR source and acceptance
        run: >-
          python -m py_compile
          mirror_scanner.py
          mirror_levels/tracker.py
          geometry/broadening.py
          tests/test_broadening_detector.py
          geometry/reversal_patterns.py
          geometry/diamond.py
          tests/test_diamond_detector.py
          geometry/channel_preview.py
          tests/test_channel_preview.py
          geometry/naked_breakout_return.py
          tests/test_naked_breakout_return.py
          tests/test_shared_reversal_candles.py
          main.py
          tests/test_scanner_pass_progress.py
          tests/test_horn_scanner.py
          pattern_freshness.py
          tests/test_pattern_freshness.py
          tests/test_mirror_standalone_paper_e2e.py
      - name: Verify HORN cutoff and existing positive/negative Gold offline
        run: python -m unittest -v tests.test_broadening_detector
      - name: Verify shared closed-candle reversal recognition without trade mutation
        run: python -m pytest -q tests/test_shared_reversal_candles.py
      - name: Verify offline Diamond geometry is causal and non-trading
        run: python -m pytest -q tests/test_diamond_detector.py
      - name: Check early four-pivot channel previews without trading
        run: python -m pytest -q tests/test_channel_preview.py
      - name: Check offline naked-breakout reversal evidence (#415)
        run: python -m pytest -q tests/test_naked_breakout_return.py
      - name: Verify read-only MIRROR observation journal projection
        run: python -m pytest -q tests/test_mirror_retest_projection.py
      - name: Check authoritative Scanner pass progress after MIRROR
        run: python -m unittest -v tests.test_scanner_pass_progress tests.test_horn_scanner
      - name: Verify owner-approved MIRROR levels and exact-linked legacy audit
        run: python -m pytest -q tests/test_mirror_levels.py -k "owner_mirror_source_policy or legacy_frozen or historical_mirror_audit or research_mirror or local_simulation_mirror"
      - name: Verify causal wick-extremum supersession
        run: python -m pytest -q tests/test_mirror_scanner_integration.py -k "extremum or wick_sweep or persisted_standalone_handoff"
      - name: Verify local native MIRROR LIMIT port and existing Box lifecycle
        run: python -m unittest -v tests.test_simulator_v2_box_lifecycle
      - name: Verify all-or-none MIRROR account risk review does not place orders
        run: >-
          python -m unittest -v
          tests.test_simulator_v2_mirror_intake.NativeMirrorSimulatorIntakeTests.test_simultaneous_mirror_uses_all_or_none_account_risk_review
          tests.test_simulator_v2_mirror_intake.NativeMirrorSimulatorIntakeTests.test_shared_mirror_risk_review_rejects_ambiguous_exposure
      - name: Full synthetic MIRROR standalone PAPER E2E and regression suite
        run: python -m unittest -v tests.test_pattern_freshness tests.test_mirror_standalone_paper_e2e
