name: Temporary apply tree verification fast path

on:
  push:
    branches:
      - workflow/tree-verification-fast-path

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'chore: stage tree verification fast path apply'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: workflow/tree-verification-fast-path
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply candidate-tree fast path
        shell: python
        run: |
          from pathlib import Path

          verify = Path("tools/dev/verify.py")
          text = verify.read_text(encoding="utf-8")

          imports_anchor = '''from .workflow import (
              Git, compact, fingerprints, index_tree, normalize_task_paths, receipt_path,
              repository_root, require_ok, resolve_inside,
          )
          '''
          constants = '''from .workflow import (
              Git, compact, fingerprints, index_tree, normalize_task_paths, receipt_path,
              repository_root, require_ok, resolve_inside,
          )


          CONTRACT_PREFIXES = (
              "terminal/api/", "terminal/application/pretrade_guard.py",
              "terminal/domain/models.py",
              "terminal/runtime/paper_http_server.py", "terminal/runtime/paper_runtime.py",
              "terminal/frontend/src/contracts/", "terminal/frontend/src/components/ModePanel",
              "tools/dev/contract_consistency.py", "tests/test_contract_consistency.py",
          )
          '''
          assert imports_anchor in text
          text = text.replace(imports_anchor, constants, 1)

          old_fast_path = '''def _markdown_tree_fast_path(
              candidate_files: Sequence[str], additional_commands: Sequence[dict[str, object]], git: Git
          ) -> bool:
              """Skip worktree materialization only for command-free Markdown on GitHub-first repos."""
              return (
                  bool(candidate_files)
                  and not additional_commands
                  and all(Path(path).suffix.lower() == ".md" for path in candidate_files)
                  and _is_github_origin(_origin_url(git))
              )
          '''
          new_fast_path = '''def tree_fast_path_eligible(
              paths: Sequence[str],
              files: Sequence[str],
              candidate_files: Sequence[str],
              additional_commands: Sequence[dict[str, object]],
              git: Git,
          ) -> bool:
              """Skip worktree materialization only when no check needs candidate files on disk."""
              return (
                  bool(candidate_files)
                  and not additional_commands
                  and not any(path.endswith(".py") for path in files)
                  and not any(path.startswith(CONTRACT_PREFIXES) for path in paths)
                  and not any(path.startswith("terminal/frontend/src/") for path in paths)
                  and _is_github_origin(_origin_url(git))
              )
          '''
          assert old_fast_path in text
          text = text.replace(old_fast_path, new_fast_path, 1)

          old_call = '''            tree_only_verification = _markdown_tree_fast_path(
                          candidate_files, additional_commands, active_git
                      )
          '''
          new_call = '''            tree_only_verification = tree_fast_path_eligible(
                          paths, files, candidate_files, additional_commands, active_git
                      )
          '''
          assert old_call in text
          text = text.replace(old_call, new_call, 1)

          old_contract = '''        contract_prefixes = (
                      "terminal/api/", "terminal/application/pretrade_guard.py",
                      "terminal/domain/models.py",
                      "terminal/runtime/paper_http_server.py", "terminal/runtime/paper_runtime.py",
                      "terminal/frontend/src/contracts/", "terminal/frontend/src/components/ModePanel",
                      "tools/dev/contract_consistency.py", "tests/test_contract_consistency.py",
                  )
                  if any(path.startswith(contract_prefixes) for path in paths):
          '''
          new_contract = '''        if any(path.startswith(CONTRACT_PREFIXES) for path in paths):
          '''
          assert old_contract in text
          text = text.replace(old_contract, new_contract, 1)
          assert '"mode": "markdown-tree"' in text
          text = text.replace('"mode": "markdown-tree"', '"mode": "candidate-tree"', 1)
          verify.write_text(text, encoding="utf-8")

          checkpoint = Path("tools/dev/checkpoint.py")
          text = checkpoint.read_text(encoding="utf-8")
          import_anchor = '''from .task_transaction import candidate_root, candidate_tree, inspect, load_transaction
          from .workflow import Git, compact, fingerprints, index_tree, read_receipt, repository_root, require_ok
          '''
          import_replacement = '''from .task_transaction import candidate_root, candidate_tree, inspect, load_transaction
          from .verify import tree_fast_path_eligible
          from .workflow import Git, compact, fingerprints, index_tree, read_receipt, repository_root, require_ok
          '''
          assert import_anchor in text
          text = text.replace(import_anchor, import_replacement, 1)
          old_tree_valid = '''            tree_valid = (
                          tree.get("status") == "PASS"
                          and tree.get("mode") == "markdown-tree"
                          and tree.get("base_head") == receipt["head"]
                          and tree.get("candidate_tree") == transaction.get("candidate_tree")
                          and tree.get("commands") == []
                          and bool(candidate_files)
                          and all(Path(path).suffix.lower() == ".md" for path in candidate_files)
                      )
          '''
          new_tree_valid = '''            tree_valid = (
                          tree.get("status") == "PASS"
                          and tree.get("mode") == "candidate-tree"
                          and tree.get("base_head") == receipt["head"]
                          and tree.get("candidate_tree") == transaction.get("candidate_tree")
                          and tree.get("commands") == []
                          and tree_fast_path_eligible(scope, files, candidate_files, (), git)
                      )
          '''
          assert old_tree_valid in text
          text = text.replace(old_tree_valid, new_tree_valid, 1)
          checkpoint.write_text(text, encoding="utf-8")

          tests = Path("tests/test_harness_lean_workflow.py")
          text = tests.read_text(encoding="utf-8")
          old_import = 'from tools.dev.verify import verify\n'
          new_import = 'from tools.dev.verify import tree_fast_path_eligible, verify\n'
          assert old_import in text
          text = text.replace(old_import, new_import, 1)

          old_setup = '''        (root / "README.md").write_text("# Base\\n", encoding="utf-8")
                  subprocess.run(
                      ("git", "add", ".gitattributes", "task.txt", "docs.txt", "README.md"),
          '''
          new_setup = '''        (root / "README.md").write_text("# Base\\n", encoding="utf-8")
                  (root / "worker.py").write_text("VALUE = 1\\n", encoding="utf-8")
                  (root / ".gitignore").write_text("__pycache__/\\n", encoding="utf-8")
                  subprocess.run(
                      ("git", "add", ".gitattributes", ".gitignore", "task.txt", "docs.txt", "README.md", "worker.py"),
          '''
          assert old_setup in text
          text = text.replace(old_setup, new_setup, 1)
          assert 'self.assertEqual(transaction["tree_verification"]["mode"], "markdown-tree")' in text
          text = text.replace(
              'self.assertEqual(transaction["tree_verification"]["mode"], "markdown-tree")',
              'self.assertEqual(transaction["tree_verification"]["mode"], "candidate-tree")',
              1,
          )

          old_non_markdown = '''    def test_github_non_markdown_transaction_keeps_isolated_verification(self):
                  temporary, root, _ = self.make_repo()
                  self.addCleanup(temporary.cleanup)
                  self.use_github_origin(root)
                  git = Git(root)
                  begin(["task.txt"], git=git, task_id="non-markdown")
                  (root / "task.txt").write_text("changed\\n", encoding="utf-8")
          
                  passed, output = verify(["task.txt"], git=git, transaction_id="non-markdown")
          
                  self.assertTrue(passed, output)
                  receipt = json.loads((root / ".git/bybitscanner/latest-pass.json").read_text(encoding="utf-8"))
                  transaction = receipt["transaction"]
                  self.assertIn("isolated_verification", transaction)
                  self.assertNotIn("tree_verification", transaction)
          '''
          new_non_markdown = '''    def test_github_passive_non_markdown_transaction_uses_tree_fast_path(self):
                  temporary, root, _ = self.make_repo()
                  self.addCleanup(temporary.cleanup)
                  self.use_github_origin(root)
                  git = Git(root)
                  begin(["task.txt"], git=git, task_id="non-markdown-fast")
                  (root / "task.txt").write_text("changed\\n", encoding="utf-8")
          
                  with patch("tools.dev.verify.create_isolated_worktree") as isolate:
                      passed, output = verify(["task.txt"], git=git, transaction_id="non-markdown-fast")
          
                  self.assertTrue(passed, output)
                  isolate.assert_not_called()
                  receipt = json.loads((root / ".git/bybitscanner/latest-pass.json").read_text(encoding="utf-8"))
                  transaction = receipt["transaction"]
                  self.assertEqual(transaction["tree_verification"]["mode"], "candidate-tree")
                  self.assertNotIn("isolated_verification", transaction)
          
                  passed, output = checkpoint("validation only", git=git)
                  self.assertTrue(passed, output)
                  self.assertIn("candidate-tree-pass", output)
          
              def test_github_python_transaction_keeps_isolated_verification(self):
                  temporary, root, _ = self.make_repo()
                  self.addCleanup(temporary.cleanup)
                  self.use_github_origin(root)
                  git = Git(root)
                  begin(["worker.py"], git=git, task_id="python-isolated")
                  (root / "worker.py").write_text("VALUE = 2\\n", encoding="utf-8")
          
                  passed, output = verify(["worker.py"], git=git, transaction_id="python-isolated")
          
                  self.assertTrue(passed, output)
                  receipt = json.loads((root / ".git/bybitscanner/latest-pass.json").read_text(encoding="utf-8"))
                  transaction = receipt["transaction"]
                  self.assertIn("isolated_verification", transaction)
                  self.assertNotIn("tree_verification", transaction)
          
              def test_tree_fast_path_rejects_materialized_check_surfaces(self):
                  temporary, root, _ = self.make_repo()
                  self.addCleanup(temporary.cleanup)
                  self.use_github_origin(root)
                  git = Git(root)
          
                  self.assertFalse(tree_fast_path_eligible(
                      ["terminal/api/schema.json"], ["terminal/api/schema.json"],
                      ["terminal/api/schema.json"], (), git,
                  ))
                  self.assertFalse(tree_fast_path_eligible(
                      ["terminal/frontend/src/view.ts"], ["terminal/frontend/src/view.ts"],
                      ["terminal/frontend/src/view.ts"], (), git,
                  ))
                  self.assertFalse(tree_fast_path_eligible(
                      ["task.txt"], ["task.txt"], ["task.txt"],
                      ({"label": "check", "cwd": ".", "argv": ["true"]},), git,
                  ))
          '''
          assert old_non_markdown in text
          text = text.replace(old_non_markdown, new_non_markdown, 1)
          tests.write_text(text, encoding="utf-8")
      - name: Verify focused workflow tests
        run: |
          python -m py_compile tools/dev/verify.py tools/dev/checkpoint.py tests/test_harness_lean_workflow.py
          python -m unittest -v tests.test_harness_lean_workflow tests.test_github_first_checkpoint
          git diff --check
      - name: Commit code patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/dev/verify.py tools/dev/checkpoint.py tests/test_harness_lean_workflow.py
          git commit -m "perf: generalize candidate-tree verification fast path"
          git push origin HEAD:workflow/tree-verification-fast-path
