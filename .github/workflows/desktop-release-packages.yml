name: Owner desktop release packages
# Desktop publication requires an explicit owner-authorized one-shot request.
# Neither a PR merge nor a push to stable can publish or install desktop apps.
# An owner-only request branch can trigger this same protected publication job.
on:
  workflow_dispatch:
  push:
    branches:
      - 'desktop-publish/*'
    paths:
      - '.github/desktop-publish-request.txt'
permissions:
  contents: write
concurrency:
  group: owner-desktop-release
  cancel-in-progress: false
jobs:
  publish:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.actor == 'svobodaXXI') }}
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stable/adfb50b-forward
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: terminal/frontend/package-lock.json
      - name: Check exact stable release and reject preexisting tag
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $sha=(git rev-parse HEAD).Trim()
          $remote=((git ls-remote origin refs/heads/stable/adfb50b-forward) -split '\s+')[0].Trim()
          if ($sha -ne $remote -or $sha -notmatch '^[a-f0-9]{40}$') { throw 'STABLE_MOVED_OR_UNKNOWN' }
          if ($env:GITHUB_EVENT_NAME -eq 'push') {
            # Only a single exact-SHA owner request, not an ordinary push.
            if ($env:GITHUB_REF_NAME -cnotmatch '^desktop-publish/([0-9a-f]{40})$') {
              throw 'INVALID_DESKTOP_REQUEST_BRANCH'
            }
            $requestedSha=$Matches[1]
            if ($requestedSha -cne $sha) { throw 'DESKTOP_REQUEST_SHA_MISMATCH' }
            $changed=@(gh api "repos/$env:GITHUB_REPOSITORY/compare/$sha...$env:GITHUB_SHA" --jq '.files[].filename')
            if ($LASTEXITCODE -ne 0 -or $changed.Count -ne 1 -or
                $changed[0] -cne '.github/desktop-publish-request.txt') {
              throw 'DESKTOP_REQUEST_UNEXPECTED_CHANGES'
            }
            $encoded=@(gh api "repos/$env:GITHUB_REPOSITORY/contents/.github/desktop-publish-request.txt?ref=$env:GITHUB_SHA" --jq '.content')
            if ($LASTEXITCODE -ne 0 -or $encoded.Count -eq 0) { throw 'DESKTOP_REQUEST_UNREADABLE' }
            $request=[Text.Encoding]::UTF8.GetString([Convert]::FromBase64String(($encoded -join ''))).Trim()
            if ($request -cne $sha) { throw 'DESKTOP_REQUEST_CONTENT_MISMATCH' }
          } elseif ($env:GITHUB_EVENT_NAME -ne 'workflow_dispatch') {
            throw 'DESKTOP_UNAUTHORIZED_EVENT'
          }
          $tag="desktop-$sha"
          # Missing tag is the expected first-publication state. Avoid an
          # intentional gh release-view 404 that PowerShell 7 treats as fatal
          # under ErrorActionPreference=Stop before checking LASTEXITCODE.
          $tagRef = (git ls-remote --refs origin "refs/tags/$tag")
          if ($LASTEXITCODE -ne 0) { throw 'DESKTOP_TAG_LOOKUP_FAILED' }
          if ($tagRef) { throw 'DESKTOP_TAG_ALREADY_EXISTS' }
          "DESKTOP_SHA=$sha" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "DESKTOP_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Build local replay static UI
        working-directory: terminal/frontend
        shell: pwsh
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { throw 'NPM_CI_FAILED' }
          npm run build:replay
          if ($LASTEXITCODE -ne 0) { throw 'REPLAY_BUILD_FAILED' }
      - name: Build Windows Manager EXE and isolated Simulator ZIP
        shell: pwsh
        run: |
          python -m pip install pyinstaller==6.16.0
          if ($LASTEXITCODE -ne 0) { throw 'PYINSTALLER_FAILED' }
          New-Item -ItemType Directory -Force -Path release-out | Out-Null
          "$env:DESKTOP_SHA" | Set-Content -Encoding ascii desktop-build-sha.txt
          "$env:GITHUB_RUN_NUMBER" | Set-Content -Encoding ascii desktop-build-number.txt
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name BybitScanner-VPS-Manager --add-data "desktop-build-sha.txt;." --add-data "desktop-build-number.txt;." tools/windows_vps_manager.py
          if ($LASTEXITCODE -ne 0) { throw 'MANAGER_BUILD_FAILED' }
          Copy-Item dist/BybitScanner-VPS-Manager.exe release-out/BybitScanner-VPS-Manager.exe
          python tools/build_machine_time_package.py --sha $env:DESKTOP_SHA --output release-out/BybitScanner-MachineTime.zip
          if ($LASTEXITCODE -ne 0) { throw 'SIMULATOR_PACKAGE_FAILED' }
      - name: Smoke-test packaged Manager Python DLL before publication
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $exe=(Resolve-Path release-out/BybitScanner-VPS-Manager.exe).Path
          # This existing CLI input is rejected locally; it never opens SSH.
          $proc=Start-Process -FilePath $exe -ArgumentList @('--operation','status','--request-id','invalid','--host','127.0.0.1','--user','root') -PassThru
          try { Wait-Process -Id $proc.Id -Timeout 30 -ErrorAction Stop }
          catch {
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
            throw 'MANAGER_BOOTSTRAP_TIMEOUT'
          }
          $proc.Refresh()
          if ($proc.ExitCode -ne 2) { throw 'MANAGER_PYTHON_DLL_BOOTSTRAP_UNPROVEN' }
      - name: Publish owner-approved desktop release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $stable=((git ls-remote origin refs/heads/stable/adfb50b-forward) -split '\s+')[0].Trim()
          if ($stable -ne $env:DESKTOP_SHA) { throw 'STABLE_MOVED_BEFORE_PUBLISH' }
          gh release create $env:DESKTOP_TAG release-out/BybitScanner-VPS-Manager.exe release-out/BybitScanner-MachineTime.zip --repo $env:GITHUB_REPOSITORY --target $env:DESKTOP_SHA --title "BybitScanner desktop $($env:DESKTOP_SHA.Substring(0,12))" --notes "Owner-approved Windows local applications only. No VPS/PAPER activation." --latest=false
          if ($LASTEXITCODE -ne 0) { throw 'DESKTOP_RELEASE_PUBLISH_FAILED' }
