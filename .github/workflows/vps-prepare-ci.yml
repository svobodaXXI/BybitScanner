name: VPS prepare-only checks

# Issues #624, #627: the Linux prepare/validate-only path and the Linux-safe shutdown on a real Linux runner.
# Offline only: only `requests` (pinned) is installed; no backend, no network to Bybit.
on:
  pull_request:
    paths:
      - "tools/vps_check.py"
      - "tools/runtime_intent.py"
      - "tools/stop_robot_runtime.py"
      - "tools/legacy_runtime_process.py"
      - "deploy/**"
      - "tests/test_vps_check.py"
      - "tests/test_stop_robot_linux.py"
      - "DOCUMENTS/VPS_DEPLOYMENT_RUNBOOK.md"
      - ".github/workflows/vps-prepare-ci.yml"
  workflow_dispatch:

concurrency:
  group: vps-prepare-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  vps-prepare-only:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the only third-party dependency of the stop tool (pinned as in requirements.txt)
        run: python -m pip install requests==2.34.2 PySocks==1.7.1
      - name: Offline prepare-only tests (Linux)
        run: python -m unittest -v tests.test_vps_check tests.test_stop_robot_linux
      - name: The validator itself runs and reports (expected FAIL items on a runner, never a start)
        run: python -m tools.vps_check --no-systemd || true
