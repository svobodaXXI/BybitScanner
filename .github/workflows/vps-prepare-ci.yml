name: VPS prepare-only checks

# Issues #624, #627: the Linux prepare/validate-only path and the Linux-safe shutdown on a real Linux runner.
# Offline only: only `requests` (pinned) is installed; no backend, no network to Bybit.
on:
  pull_request:
    paths:
      - "tools/vps_check.py"
      - "tools/runtime_intent.py"
      - "tools/stop_robot_runtime.py"
      - "tools/legacy_runtime_process.py"
      - "deploy/**"
      - "tests/test_vps_check.py"
      - "tests/test_stop_robot_linux.py"
      - "DOCUMENTS/VPS_DEPLOYMENT_RUNBOOK.md"
      - "ci/systemd_shutdown_probe.py"
      - "ci/systemd_start_probe.py"
      - "signal/__init__.py"
      - "tests/test_linux_contour.py"
      - ".github/workflows/vps-prepare-ci.yml"
  workflow_dispatch:

concurrency:
  group: vps-prepare-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  vps-prepare-only:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the only third-party dependency of the stop tool (pinned as in requirements.txt)
        run: python -m pip install requests==2.34.2 PySocks==1.7.1
      - name: Offline prepare-only tests (Linux)
        run: python -m unittest -v tests.test_vps_check tests.test_stop_robot_linux tests.test_runtime_intent_bootstrap tests.test_linux_contour
      - name: The validator itself runs and reports (expected FAIL items on a runner, never a start)
        run: python -m tools.vps_check --no-systemd || true

  systemd-shutdown-semantics:
    # Real systemd (runner PID 1, root): dummy units derived from deploy/systemd keep the repository's
    # stop keys verbatim. Proves: a blocked ExecStop leaves the protected process alive; a successful
    # ExecStop ends the unit cleanly; the Telegram unit's KillMode lets the real launch_detached helper
    # outlive the worker (control-group would reap it). No BybitScanner runtime, DB, network or Telegram.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install requests==2.34.2 PySocks==1.7.1
      - name: Dummy-unit probe of the stop semantics
        run: sudo "$(which python)" ci/systemd_shutdown_probe.py

  systemd-start-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Real systemd, isolated dummy units, canonical readiness and intent
        run: sudo env GITHUB_ACTIONS=true "$(which python)" ci/systemd_start_probe.py

  windows-bootstrap-regression:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install requests==2.34.2 PySocks==1.7.1
      - run: python -m unittest -v tests.test_vps_check tests.test_stop_robot_linux tests.test_runtime_intent_bootstrap tests.test_linux_contour
