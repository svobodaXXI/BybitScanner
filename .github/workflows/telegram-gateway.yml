name: Telegram Gateway MVP

on:
  push:
    branches:
      - feature/684-telegram-gateway-send
  pull_request:
    paths:
      - 'telegram_gateway_client.py'
      - 'telegram_gateway_outbox.py'
      - 'telegram_bot.py'
      - 'telegram_monitoring.py'
      - 'deploy/telegram_gateway/**'
      - 'tests/test_telegram_gateway_*.py'
      - '.github/workflows/telegram-gateway.yml'

jobs:
  gateway:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install minimal Python test dependencies
        run: python -m pip install requests PySocks
      - name: Syntax-check Gateway Worker
        run: node --check deploy/telegram_gateway/worker.mjs
      - name: Focused Python tests
        run: python -m unittest discover -s tests -p 'test_telegram_gateway_*.py' -v
