name: MIRROR ICNT consecutive 7-8 Nov research

# The two exact public archives must be consecutive and independently verified.
# One native Scanner/Robot clock crosses midnight; no PAPER or LIVE access.
on:
  pull_request:
    paths:
      - "research/simulator_v2/mirror_real_archive_probe.py"
      - ".github/workflows/mirror-icnt-consecutive-two-days.yml"
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: mirror-icnt-consecutive-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-consecutive:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.number == 1024
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install original offline Scanner policy imports
        run: >-
          python -m pip install
          requests==2.34.2
          PySocks==1.7.1
          websocket-client==1.9.0
          pandas==3.0.5
          numpy==2.5.1
          matplotlib==3.11.1
          mplfinance==0.12.10b0
          six==1.17.0
      - name: Fetch and verify both immutable public archive SHA256 values
        run: |
          python - <<'PY'
          from hashlib import sha256
          from pathlib import Path
          from urllib.request import Request, urlopen
          approved = {
              "2026-11-07": "6d81de558d1b4c1fe8c43caa8e1cdd9c1211feffcae3325dfff9909e999bcec8",
              "2026-11-08": "797a84c3483f894b4041159ea6a8d2ef7e3377fbc6aac46b5fed28da357d3e6d",
          }
          for day, expected in approved.items():
              name = f"ICNTUSDT{day}.csv.gz"
              url = f"https://public.bybit.com/trading/ICNTUSDT/{name}"
              digest = sha256()
              size = 0
              with urlopen(Request(url, headers={
                  "User-Agent": "BybitScanner-SimulatorV2-Research/1.0",
              }), timeout=45) as response:
                  if response.geturl() != url:
                      raise ValueError("unapproved archive redirect")
                  with Path(name).open("xb") as out:
                      while True:
                          chunk = response.read(1024 * 1024)
                          if not chunk:
                              break
                          size += len(chunk)
                          if size > 128_000_000:
                              raise ValueError("public archive exceeds bounded bytes")
                          digest.update(chunk)
                          out.write(chunk)
              if digest.hexdigest() != expected:
                  raise ValueError("approved daily archive SHA mismatch")
              print("VERIFIED_PUBLIC_ARCHIVE", name, size, digest.hexdigest())
          PY
      - name: Compare two native Mirror risk profiles without midnight reset
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONUNBUFFERED: "1"
        run: >-
          python -m research.simulator_v2.mirror_real_archive_probe
          --archive ICNTUSDT2026-11-07.csv.gz
          --next-day-archive ICNTUSDT2026-11-08.csv.gz
          --utc-day 2026-11-07
          --report mirror-icnt-consecutive-20261107-08.json
          --compare-one-fill
      - name: Keep JSON proof, not source archives
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mirror-icnt-consecutive-20261107-08
          path: mirror-icnt-consecutive-20261107-08.json
          if-no-files-found: error
          retention-days: 7
