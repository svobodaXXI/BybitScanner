name: Triangle first-wave offline regression

on:
  pull_request:
    paths:
      - "geometry/pair_metrics.py"
      - "tests/test_geometry_triangle_local_anchors.py"
      - "tests/fixtures/geometry_gold/**"
      - ".github/workflows/triangle-first-wave-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  triangle-first-wave:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install offline geometry imports
        run: >-
          python -m pip install
          pandas==3.0.5 numpy==2.5.1 matplotlib==3.11.1
          mplfinance==0.12.10b0 six==1.17.0
      - name: Compile first-wave geometry and tests
        run: python -m py_compile geometry/pair_metrics.py tests/test_geometry_triangle_local_anchors.py
      - name: Verify single first wave, owner Gold and HORN independence
        run: python -m unittest -v tests.test_geometry_triangle_local_anchors tests.test_broadening_detector
