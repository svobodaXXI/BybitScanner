name: Triangle first-wave offline regression

on:
  pull_request:
    paths:
      - "geometry/pair_metrics.py"
      - "geometry/evaluation.py"
      - "geometry/engine.py"
      - "geometry/wedge_boundaries.py"
      - "tests/test_geometry_formation_fit.py"
      - "geometry/envelope_metrics.py"
      - "tests/test_geometry_strict_wedge_owner.py"
      - "tests/test_geometry_triangle_local_anchors.py"
      - "tests/fixtures/geometry_gold/**"
      - ".github/workflows/triangle-first-wave-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  triangle-first-wave:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install offline geometry imports
        run: >-
          python -m pip install
          pandas==3.0.5 numpy==2.5.1 matplotlib==3.11.1
          mplfinance==0.12.10b0 six==1.17.0
      - name: Compile first-wave geometry and tests
        run: python -m py_compile geometry/pair_metrics.py tests/test_geometry_triangle_local_anchors.py
      - name: Verify single first wave, owner Gold and HORN independence
        run: python -m unittest -v tests.test_geometry_triangle_local_anchors tests.test_broadening_detector
      - name: Verify strict wedge owner case
        run: python -m unittest -v tests.test_geometry_strict_wedge_owner
      - name: Checkout pinned pre-change baseline for attribution
        uses: actions/checkout@v4
        with:
          ref: 8cd852a36098b29a33504e9af4f357f75edd142d
          path: geometry-baseline
          persist-credentials: false
      - name: Compare historical selection on baseline and PR
        shell: bash
        run: |
          set -e
          for root in geometry-baseline .; do
            (
              cd "$root"
              echo "BASELINE_COMPARISON_ROOT=$root"
              python - <<'PY'
          import json
          from tests.test_geometry_formation_fit import HistoricalFormationFitTest as T, identity, expected_identity
          from wedge.detector import detect_structure
          T.setUpClass()
          for name, g in T.winners.items():
              info = {"symbol": name, "actual": identity(g),
                      "archived": expected_identity(T.cases[name]["expected"])}
              if g is not None:
                  info.update(family=g.pair_metrics.get("anchor_sequence", {}).get("family"),
                              valid=g.pair_metrics.get("anchor_sequence", {}).get("valid"),
                              detected=detect_structure(g, candles=T.frames[name])["detected"],
                              body_fit=g.envelope_metrics.get("formation_body_fit"))
              print("COMPARISON", json.dumps(info, sort_keys=True))
          PY
            )
          done
          set +e
          (cd geometry-baseline && python -m unittest -v tests.test_geometry_formation_fit)
          status=$?
          set -e
          echo "PINNED_BASELINE_EXIT=$status"
          # Baseline is evidence, not a waiver: the PR gate below still runs.
      - name: Verify frozen eleven-case formation fit and selection
        run: python -m unittest -v tests.test_geometry_formation_fit
