name: TEMP P0.3 implementation

on:
  push:
    branches:
      - robot-v0-1-safety-p0-3
    paths:
      - ".github/workflows/temp-p0-3-implementation.yml"

permissions:
  contents: write

jobs:
  patch-test-push:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: robot-v0-1-safety-p0-3
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply scoped P0.3 patch
        run: |
          python .github/temp_p0_3_patch.py
          python .github/temp_p0_3_testfix.py
      - name: Install focused dependencies
        run: python -m pip install requests==2.34.2 PySocks==1.7.1 websocket-client==1.9.0
      - name: Compile scoped surface
        run: >-
          python -m py_compile
          terminal/application/robot_breakout_monitor.py
          tests/test_robot_breakout_monitor.py
          tests/test_robot_paper_acceptance.py
      - name: Run P0.3 focused tests
        run: >-
          python -m unittest -v
          tests.test_robot_breakout_monitor
          tests.test_robot_paper_acceptance
      - name: Check exact scope and whitespace
        shell: bash
        run: |
          python - <<'PY'
          import subprocess
          allowed = {
              "terminal/application/robot_breakout_monitor.py",
              "tests/test_robot_breakout_monitor.py",
          }
          out = subprocess.check_output(["git", "status", "--porcelain"], text=True)
          changed = {line[3:] for line in out.splitlines() if line.strip()}
          if changed != allowed:
              raise SystemExit(f"unexpected P0.3 scope: {sorted(changed)}")
          PY
          git diff --check
      - name: Commit and push P0.3
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add terminal/application/robot_breakout_monitor.py tests/test_robot_breakout_monitor.py
          git commit -m "fix: make first Robot partial fill final"
          git push origin HEAD:robot-v0-1-safety-p0-3
