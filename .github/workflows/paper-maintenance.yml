name: PAPER maintenance focused verification
on:
  pull_request:
    paths:
      - 'tools/paper_maintenance.py'
      - 'tools/paper_interrupted_stop_recovery.py'
      - 'tools/paper_stopped_approved_recovery.py'
      - 'tools/vps_paper_auto_start.py'
      - 'tools/vps_systemd_unit_prepare.py'
      - 'tools/vps_manual_main_gateway.py'
      - 'terminal/application/manual_main_trading.py'
      - 'terminal/runtime/manual_main_read_server.py'
      - 'terminal/persistence/live_account_store.py'
      - 'tests/test_manual_main_trading.py'
      - 'deploy/systemd/bybitscanner-manual-main-read.service'
      - 'deploy/terminal_ingress/nginx-authenticated.conf'
      - 'tests/test_vps_manual_main_gateway.py'
      - 'tools/vps_gitless_release_activate.py'
      - 'tools/vps_release_identity.py'
      - 'tools/vps_release_resume.py'
      - 'tools/vps_terminal_frontend_publish.py'
      - 'tests/test_paper_maintenance.py'
      - 'tests/test_paper_interrupted_stop_recovery.py'
      - 'tests/test_paper_stopped_approved_recovery.py'
      - 'tests/test_vps_paper_auto_start.py'
      - 'tests/test_vps_release_resume.py'
      - 'tests/test_vps_systemd_unit_prepare.py'
      - 'tests/test_vps_gitless_release_activate.py'
      - 'tests/test_vps_terminal_frontend_publish.py'
      - '.github/workflows/paper-maintenance.yml'
  workflow_dispatch:

jobs:
  maintenance:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests==2.34.2 PySocks==1.7.1 websocket-client==1.9.0 pytest pandas==3.0.5 numpy==2.5.1 matplotlib==3.11.1 mplfinance==0.12.10b0 six==1.17.0
      - run: python -m py_compile tools/paper_maintenance.py tools/paper_interrupted_stop_recovery.py tools/paper_stopped_approved_recovery.py tools/vps_systemd_unit_prepare.py tools/vps_release_resume.py tools/vps_gitless_release_activate.py tools/vps_terminal_frontend_publish.py tools/vps_manual_main_gateway.py terminal/application/manual_main_trading.py terminal/runtime/manual_main_read_server.py
      - run: python -m pytest -q tests/test_paper_interrupted_stop_recovery.py tests/test_paper_stopped_approved_recovery.py tests/test_paper_maintenance.py tests/test_vps_systemd_unit_prepare.py tests/test_vps_release_resume.py tests/test_vps_gitless_release_activate.py tests/test_vps_terminal_frontend_publish.py tests/test_vps_paper_auto_start.py tests/test_vps_manual_main_gateway.py tests/test_manual_main_trading.py
