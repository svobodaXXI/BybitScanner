name: PAPER maintenance focused verification
on:
  pull_request:
    paths:
      - 'tools/paper_maintenance.py'
      - 'tools/vps_systemd_unit_prepare.py'
      - 'tests/test_paper_maintenance.py'
      - 'tests/test_vps_systemd_unit_prepare.py'
      - '.github/workflows/paper-maintenance.yml'
  workflow_dispatch:

jobs:
  maintenance:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests pytest
      - run: python -m py_compile tools/paper_maintenance.py tools/vps_systemd_unit_prepare.py
      - run: python -m pytest -q tests/test_paper_maintenance.py tests/test_vps_systemd_unit_prepare.py
