name: Simulator V2 one-day public trade gap diagnosis

on:
  pull_request:
    branches:
      - 'stable/adfb50b-forward'
    paths:
      - '.github/workflows/simulator-v2-gap-diagnostic.yml'

permissions:
  contents: read

jobs:
  pinpoint-missing-public-minutes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check exact missing UTC minute for GRASSUSDT and XRPUSDT
        run: |
          python - <<'PY'
          import csv
          from datetime import datetime, timezone
          from decimal import Decimal
          import gzip
          from hashlib import sha256
          from io import BytesIO, TextIOWrapper
          from urllib.request import Request, urlopen

          start = int(datetime(2026, 10, 1, tzinfo=timezone.utc).timestamp()*1000)
          end = start + 86_400_000
          for symbol in ("GRASSUSDT", "XRPUSDT"):
              url = f"https://public.bybit.com/trading/{symbol}/{symbol}2026-10-01.csv.gz"
              req = Request(url, method="GET",
                            headers={"User-Agent": "BybitScanner-SimulatorV2-Research/1.0"})
              with urlopen(req, timeout=30) as response:
                  if response.geturl() != url:
                      raise ValueError("unexpected public archive redirect")
                  raw = response.read(64_000_001)
              if not 0 < len(raw) <= 64_000_000:
                  raise ValueError("invalid/oversize targeted public trade archive")
              seen = set()
              trades = 0
              with gzip.GzipFile(fileobj=BytesIO(raw)) as uncompressed:
                  reader = csv.DictReader(TextIOWrapper(uncompressed, encoding="utf-8-sig"))
                  if not reader.fieldnames or not {"symbol", "timestamp"}.issubset(reader.fieldnames):
                      raise ValueError("unexpected public trades format")
                  for row in reader:
                      if row["symbol"] != symbol:
                          raise ValueError("foreign symbol in public trade archive")
                      time_ms = int(Decimal(row["timestamp"]) * 1000)
                      if not start <= time_ms < end:
                          raise ValueError("trade belongs to another UTC day")
                      seen.add((time_ms//60000)*60000)
                      trades += 1
              missing = [
                  datetime.fromtimestamp(t/1000, timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")
                  for t in range(start,end,60000) if t not in seen
              ]
              print(f"GAP_DIAGNOSTIC_ONLY symbol={symbol} trades={trades}"
                    f" complete_minutes={len(seen)} missing_minutes={missing}"
                    f" compressed_bytes={len(raw)} sha256={sha256(raw).hexdigest()}",
                    flush=True)
          print("DIAGNOSTIC_COMPLETE_NO_CANDLES_WERE_SYNTHESIZED")
          PY
