name: Robot PAPER deterministic acceptance

on:
  pull_request:
    paths:
      - "robot_*.py"
      - "scanner_geometry_cursor.py"
      - "terminal/application/robot_*.py"
      - "terminal/runtime/paper_runtime.py"
      - "terminal/runtime/paper_http_server.py"
      - "terminal/persistence/**"
      - "terminal/paper/**"
      - "tests/test_robot_breakout_monitor.py"
      - "tests/test_robot_paper_execution_threading.py"
      - "tests/test_robot_paper_acceptance_driver.py"
      - "tools/e2e/run_robot_paper_acceptance.py"
      - ".github/workflows/robot-paper-acceptance-ci.yml"
  workflow_dispatch:

concurrency:
  group: robot-paper-acceptance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deterministic-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install project dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile acceptance driver
        run: python -m py_compile tools/e2e/run_robot_paper_acceptance.py tests/test_robot_paper_acceptance_driver.py
      - name: Driver contract tests
        run: python -m unittest -v tests.test_robot_paper_acceptance_driver
      - name: Deterministic Robot PAPER acceptance
        run: python -m tools.e2e.run_robot_paper_acceptance
