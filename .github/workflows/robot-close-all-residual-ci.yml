name: Robot close-all residual exposure safety

# Synthetic owner/store state only; no PAPER DB, backend, exchange, or credentials.
on:
  pull_request:
    paths:
      - "terminal/runtime/paper_runtime.py"
      - "terminal/runtime/paper_http_server.py"
      - "terminal/persistence/sqlite_store.py"
      - "terminal/application/robot_manual_close_proof.py"
      - "terminal/application/paper_close_all_report.py"
      - "terminal/api/models.py"
      - "terminal/application/robot_trade_ledger.py"
      - "terminal/api/rest.py"
      - "tests/test_robot_close_all_stable_identity.py"
      - "tests/test_robot_manual_close_evidence.py"
      - "tests/test_paper_close_all_stable_identity.py"
      - "tests/test_paper_close_all_owner_coordination.py"
      - "tests/test_box_pristine_baseline.py"
      - "tests/test_paper_close_all_economics.py"
      - "tests/test_robot_close_all_owner_preflight.py"
      - "tests/test_robot_close_all_pending_work_preflight.py"
      - "tests/test_robot_close_all_trade_ledger_preflight.py"
      - "tests/test_robot_reconcile_orphan_trade_ledger.py"
      - "tests/test_robot_close_all_residual_proof.py"
      - ".github/workflows/robot-close-all-residual-ci.yml"

permissions:
  contents: read

jobs:
  close-all-residual-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install existing lightweight runtime imports
        run: >-
          python -m pip install
          requests==2.34.2
          PySocks==1.7.1
          websocket-client==1.9.0
          pandas==3.0.5
          numpy==2.5.1
          matplotlib==3.11.1
          mplfinance==0.12.10b0
      - name: Compile affected code and tests
        run: >-
          python -m py_compile
          terminal/runtime/paper_runtime.py
          terminal/runtime/paper_http_server.py
          terminal/persistence/sqlite_store.py
          terminal/application/robot_manual_close_proof.py
          terminal/application/paper_close_all_report.py
          terminal/api/models.py
          terminal/application/robot_trade_ledger.py
          terminal/api/rest.py
          tests/test_robot_close_all_residual_proof.py
          tests/test_robot_close_all_stable_identity.py
          tests/test_robot_manual_close_evidence.py
          tests/test_paper_close_all_stable_identity.py
          tests/test_paper_close_all_owner_coordination.py
          tests/test_box_pristine_baseline.py
          tests/test_paper_close_all_economics.py
          tests/test_robot_close_all_owner_preflight.py
          tests/test_robot_close_all_pending_work_preflight.py
          tests/test_robot_close_all_trade_ledger_preflight.py
          tests/test_robot_reconcile_orphan_trade_ledger.py
      - name: Robot close-all residual exposure regression
        run: >-
          python -m unittest -v
          tests.test_robot_close_all_residual_proof
          tests.test_robot_close_all_stable_identity
          tests.test_robot_manual_close_evidence
          tests.test_paper_close_all_stable_identity
          tests.test_paper_close_all_owner_coordination
          tests.test_box_pristine_baseline.PristineBaselineTests.test_never_started_recovery_refuses_unfinished_market_command
          tests.test_paper_close_all_economics
          tests.test_robot_close_all_owner_preflight
          tests.test_robot_close_all_pending_work_preflight
          tests.test_robot_close_all_trade_ledger_preflight
          tests.test_robot_reconcile_orphan_trade_ledger
