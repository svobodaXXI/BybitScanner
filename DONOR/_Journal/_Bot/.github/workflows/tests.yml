name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: trading_journal
          POSTGRES_PASSWORD: trading_journal_ci
          POSTGRES_DB: trading_journal
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U trading_journal -d trading_journal"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      DATABASE_URL: postgresql+asyncpg://trading_journal:trading_journal_ci@127.0.0.1:5432/trading_journal
      TEST_DATABASE_URL: postgresql+asyncpg://trading_journal:trading_journal_ci@127.0.0.1:5432/trading_journal_test
      PGPASSWORD: trading_journal_ci

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Create isolated test database
        run: psql -h 127.0.0.1 -U trading_journal -d trading_journal -c 'CREATE DATABASE trading_journal_test;'

      - name: Apply Alembic migrations to test database
        env:
          DATABASE_URL: postgresql+asyncpg://trading_journal:trading_journal_ci@127.0.0.1:5432/trading_journal_test
        run: alembic upgrade head

      - name: Run full pytest suite
        run: pytest
