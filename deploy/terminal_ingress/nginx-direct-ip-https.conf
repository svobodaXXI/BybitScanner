# Development template only. NEVER install until localhost auth failure tests
# have passed and owner has approved exposure of :80/:443 on the VPS.
# Replace the IP only if the authoritative VPS public address changes.
# Certbot >=5.4: shortlived IP certificate, webroot challenge, auto-renew.
server {
    listen 80;
    server_name 83.217.213.181;
    server_tokens off;
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/bybitscanner/acme-challenge;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 404; }
}
server {
    listen 443 ssl;
    server_name 83.217.213.181;
    server_tokens off;
    ssl_certificate /etc/letsencrypt/live/83.217.213.181/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/83.217.213.181/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Only the guarded internal nginx listener is reachable.
    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_buffering off;
    }
}
