# INSTALL ONLY AFTER EXPLICIT OWNER VPS/INGRESS APPROVAL.
# HTTPS terminates at a separately provisioned authenticated TLS tunnel.
# Tunnel origin MUST be http://127.0.0.1:8081 ONLY, never :8080 or :8765.
# Default deny when auth sidecar is down (auth_request returns 5xx).
server {
    listen 127.0.0.1:8081;
    server_name _;

    root /var/www/bybitscanner;
    index index.html;
    server_tokens off;
    # Keep websocket forwarding explicit without relying on external nginx map.


    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Cache-Control "no-store" always;

    location = /login {
        proxy_pass http://127.0.0.1:8091;
        proxy_set_header Host $host;
    }
    location = /_telegram_auth {
        limit_except POST { deny all; }
        client_max_body_size 8k;
        proxy_pass http://127.0.0.1:8091;
        proxy_set_header Host $host;
        proxy_set_header Origin $http_origin;
        proxy_set_header Cookie "";
    }
    location = /_auth {
        internal;
        proxy_pass http://127.0.0.1:8091;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Original-Method $request_method;
        proxy_set_header X-Original-Origin $http_origin;
        proxy_set_header X-Original-Upgrade $http_upgrade;
    }

    # The backend is never publicly exposed, including on auth-service failure.
    location /api/ {
        auth_request /_auth;
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        auth_request /_auth;
        try_files $uri $uri/ /index.html;
    }
}
